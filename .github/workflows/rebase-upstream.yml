name: Rebase on upstream

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: instagram-fix
          fetch-depth: 0

      - name: Rebase onto upstream mealie-next
        id: rebase
        run: |
          git config user.name "Hely0n"
          git config user.email "markus.dev@outlook.de"
          git remote add upstream https://github.com/mealie-recipes/mealie.git
          git fetch upstream mealie-next

          if [ "$(git rev-list --count HEAD..upstream/mealie-next)" = "0" ]; then
            echo "Already up to date with upstream."
            echo "rebased=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git rebase upstream/mealie-next || {
            git rebase --abort
            echo "::error::Rebase conflict with upstream mealie-next — manual rebase needed."
            exit 1
          }

          git push --force-with-lease origin instagram-fix
          echo "rebased=true" >> "$GITHUB_OUTPUT"

      - name: Trigger image build
        if: steps.rebase.outputs.rebased == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-image.yml --ref instagram-fix --repo ${{ github.repository }}
